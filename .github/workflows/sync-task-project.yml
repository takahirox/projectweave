name: Sync task Project permission

on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]

permissions: {}

# Never interrupt a run between its Project mutations. Event order is irrelevant:
# every run reads current Issue state, including after its writes.
concurrency:
  group: sync-task-project-${{ github.repository }}-${{ github.event.issue.node_id }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reconcile Issue with takahirox Project 4
        env:
          GH_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
          ISSUE_ID: ${{ github.event.issue.node_id }}
        shell: bash
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::error::Configure the ADD_TO_PROJECT_PAT Actions repository secret with an expiring user-Project write token. See docs/project-automation.md. Automation is inactive until configured.'
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          import subprocess

          def api(query, **variables):
              result = subprocess.run(
                  ['gh', 'api', 'graphql', '--input', '-'],
                  input=json.dumps({'query': query, 'variables': variables}),
                  text=True, capture_output=True, check=True,
              )
              payload = json.loads(result.stdout)
              if payload.get('errors'):
                  raise RuntimeError('GraphQL request failed; check token permissions and Project configuration')
              return payload['data']

          def pages(query, path, **variables):
              cursor = None
              while True:
                  value = api(query, cursor=cursor, **variables)
                  for key in path:
                      value = value[key]
                  yield from value['nodes']
                  if not value['pageInfo']['hasNextPage']:
                      return
                  cursor = value['pageInfo']['endCursor']

          issue_id = os.environ['ISSUE_ID']
          project_id = api('''query {
            user(login: "takahirox") { projectV2(number: 4) { id } }
          }''')['user']['projectV2']['id']
          fields = list(pages('''query($project: ID!, $cursor: String) {
            node(id: $project) { ... on ProjectV2 {
              fields(first: 100, after: $cursor) {
                nodes { ... on ProjectV2SingleSelectField { id name options { id name } } }
                pageInfo { hasNextPage endCursor }
              }
            } }
          }''', ('node', 'fields'), project=project_id))

          def field_option(name, option):
              field = next((field for field in fields if field.get('name') == name), None)
              choice = next((value for value in (field or {}).get('options', [])
                             if value['name'] == option), None)
              if not choice:
                  raise RuntimeError(f'Project 4 needs single-select {name} with option {option}')
              return field['id'], choice['id']

          todo = field_option('Status', 'Todo')
          ready = field_option('AI execution', 'Ready')
          not_ready = field_option('AI execution', 'Not ready')

          def snapshot():
              labels = list(pages('''query($issue: ID!, $cursor: String) {
                node(id: $issue) { ... on Issue {
                  labels(first: 100, after: $cursor) {
                    nodes { name } pageInfo { hasNextPage endCursor }
                  }
                } }
              }''', ('node', 'labels'), issue=issue_id))
              node = api('''query($issue: ID!) {
                node(id: $issue) { __typename ... on Issue { state } }
              }''', issue=issue_id)['node']
              return node['__typename'], node.get('state'), frozenset(x['name'] for x in labels)

          def eligible(state):
              kind, status, labels = state
              return kind == 'Issue' and status == 'OPEN' and 'task' in labels and 'draft' not in labels

          def find_item():
              return next((item['id'] for item in pages('''query($issue: ID!, $cursor: String) {
                node(id: $issue) { ... on Issue {
                  projectItems(first: 100, after: $cursor, includeArchived: true) {
                    nodes { id project { id } } pageInfo { hasNextPage endCursor }
                  }
                } }
              }''', ('node', 'projectItems'), issue=issue_id)
                  if item['project']['id'] == project_id), None)

          def set_field(item, field):
              api('''mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $project, itemId: $item, fieldId: $field,
                  value: { singleSelectOptionId: $option }
                }) { projectV2Item { id } }
              }''', project=project_id, item=item, field=field[0], option=field[1])

          for attempt in range(5):
              state = snapshot()
              item = find_item()
              # Discovery may take multiple API pages. Refresh before any writes.
              if snapshot() != state:
                  continue
              if eligible(state):
                  if item is None:
                      item = api('''mutation($project: ID!, $issue: ID!) {
                        addProjectV2ItemById(input: {projectId: $project, contentId: $issue}) {
                          item { id }
                        }
                      }''', project=project_id, issue=issue_id)['addProjectV2ItemById']['item']['id']
                  # Direct lookup avoids truncating an item's fieldValues connection.
                  status = api('''query($item: ID!) {
                    node(id: $item) { ... on ProjectV2Item {
                      fieldValueByName(name: "Status") {
                        ... on ProjectV2ItemFieldSingleSelectValue { optionId }
                      }
                    } }
                  }''', item=item)['node']['fieldValueByName']
                  if snapshot() != state:
                      continue
                  if not status:
                      set_field(item, todo)
              if item is not None:
                  set_field(item, ready if eligible(state) else not_ready)
              # Events arriving during writes are reconciled again, not replayed.
              if snapshot() == state:
                  print('Project permission reconciled with current Issue eligibility.')
                  break
          else:
              item = find_item()
              if item is not None:
                  set_field(item, not_ready)
              raise RuntimeError('Issue kept changing; permission left Not ready. Re-run this workflow after changes settle.')
          PY
