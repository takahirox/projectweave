[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "projectweave"
version = "0.1.0"
description = "One-shot graph orchestration for GitHub Projects"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
projectweave = "projectweave.cli:main"

[tool.setuptools]
packages = ["projectweave"]
